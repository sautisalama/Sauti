# Dependabot: vulnerability alerts come from GitHub's advisory database (turn on "Dependabot alerts" and
# "Dependabot security updates" in Settings > Code security). This file adds a weekly, grouped update so
# routine upgrades arrive as one pull request, not dozens.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    labels: [dependencies]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ["*"]
